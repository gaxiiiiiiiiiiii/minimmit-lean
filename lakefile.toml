name = "minimmit-lean"
defaultTargets = ["Minimmit"]

[leanOptions]
# 宣言していない識別子を暗黙の変数として補わない。定理文の打ち間違いをエラーにする
autoImplicit = false
# 100 字を超える行を警告する（Mathlib の style linter）
weak.linter.style.longLine = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"        # lean-toolchain (leanprover/lean4:v4.29.1) と一致させる

[[lean_lib]]
name = "Minimmit"
# Minimmit/ 配下の全ファイルをビルドする（root module の import 有無によらず）
globs = ["Minimmit", "Minimmit.+"]
